[package]
name = "counter-sample"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lib]
name = "counter_sample"
path = "src/lib.rs"

[[bin]]
name = "counter_sample_plugin"
path = "src/main.rs"

[[bin]]
name = "typegen"
path = "src/bin/typegen.rs"

[dependencies]
anyhow = "1"
serde = { workspace = true }
serde_json = { workspace = true }
streamdeck-plugin = { path = "../../crates/streamdeck-plugin", features = ["macros", "typegen"] }
tokio = { workspace = true }
ts-rs = { workspace = true }
