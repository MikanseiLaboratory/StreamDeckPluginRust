name: release

on:
  push:
    tags: ["v*"]

jobs:
  pack:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Pack sample plugin
        shell: pwsh
        run: ./pack.ps1
      - name: Upload Stream Deck plugin
        uses: actions/upload-artifact@v4
        with:
          name: countersample-plugin
          path: artifacts/plugin/*.streamDeckPlugin
      - name: GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release create "${{ github.ref_name }}" \
            artifacts/plugin/*.streamDeckPlugin \
            --title "${{ github.ref_name }}" \
            --generate-notes

  crates:
    needs: pack
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: rust-lang/crates-io-auth-action@v1
        id: auth
      - name: Publish crates in dependency order
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: |
          cargo publish -p streamdeck-plugin-protocol
          cargo publish -p streamdeck-plugin-macros
          cargo publish -p streamdeck-plugin
