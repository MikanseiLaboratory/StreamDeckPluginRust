[workspace]
resolver = "2"
members = [
    "crates/streamdeck-plugin-protocol",
    "crates/streamdeck-plugin-macros",
    "crates/streamdeck-plugin",
    "samples/counter-sample",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "Apache-2.0"
repository = "https://github.com/MikanseiLaboratory/StreamDeckPluginRust"
homepage = "https://github.com/MikanseiLaboratory/StreamDeckPluginRust"
authors = ["Mikansei Laboratory"]

[workspace.dependencies]
async-trait = "0.1"
futures = "0.3"
inventory = "0.3.24"
proc-macro2 = "1"
quote = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
syn = { version = "2", features = ["full"] }
thiserror = "2"
tokio = { version = "1", features = ["io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-tungstenite = "0.26"
tokio-util = { version = "0.7", features = ["rt"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
ts-rs = "10.1"
